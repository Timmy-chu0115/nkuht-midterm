<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新生互助任務</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<style>
/* 單一視覺世界：夜色校園底 + 米色像素面板；手機優先，單欄 */
:root{
  --night:#1f2a4d; --night2:#2e4a7d; --ink:#1d1b2f; --paper:#f6efdc; --paper2:#e8e0cc;
  --gold:#f2b134; --gold-soft:#fbe3a6; --red:#b0413e; --red-soft:#fbe0da; --green:#2f6b3a;
  --mute:#5a5470; --lilac:#c9c2e0; --white:#ffffff; --me:#d8f2b8; --grass:#6fb35a; --lock:#d9d3c3;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-px:'Press Start 2P','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body)}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--night);font-size:15px;line-height:1.6}
.app.big{font-size:17.5px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.px{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.pf{font-family:var(--f-px);letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}
svg.sp{display:block;image-rendering:pixelated}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--paper)}
.bar .in{display:flex;align-items:center;gap:10px;padding-block:10px}
.bar .t1{font-size:.8em;color:var(--lilac)}
.bar .t2{font-weight:900;font-size:1.05em;line-height:1.3}
.iconbtn{background:transparent;border:2px solid #4a4568;color:var(--paper);min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:.85em}
.dots{display:flex;gap:3px}
.dots i{width:11px;height:11px;background:#4a4568;display:block}
.dots i.on{background:var(--gold)}
/* panels */
.main{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:16px 24px}
.panel{background:var(--paper);padding:14px;display:flex;flex-direction:column;gap:12px}
h1,h2{margin:0;text-wrap:balance}
h1{font-size:1.6em;font-weight:900;color:var(--paper);letter-spacing:.04em}
h2{font-size:1.15em;font-weight:900}
.lead{color:var(--lilac);margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);min-height:50px;padding:8px 14px;font-weight:900;font-size:1.05em;width:100%}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{background:#b8b1c9;color:#4a4568;box-shadow:none}
.btn.ghost{background:var(--paper2)}
.btn.small{min-height:46px;font-size:.95em;width:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.95em}
.field input{font:inherit;font-size:1.05em;border:3px solid var(--ink);background:var(--white);color:var(--ink);padding:10px 12px;min-height:48px;border-radius:0}
.err{color:var(--red);font-weight:700;font-size:.9em;margin:0}
.note{font-size:.85em;color:var(--mute);margin:0}
.ribbon{background:var(--red);color:var(--white);font-size:.8em;font-weight:700;text-align:center;padding:6px 10px}
ul.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--ink)}
/* avatar */
.avs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.av{background:var(--white);border:3px solid var(--ink);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.av[aria-pressed="true"]{background:var(--gold-soft);box-shadow:4px 4px 0 var(--ink)}
/* dialogue */
.talk{display:flex;gap:12px;align-items:flex-start}
.portrait{flex:none;border:3px solid var(--ink);background:var(--paper2)}
.who{font-size:.8em;font-weight:900;color:var(--red)}
.say{font-size:1.02em}
/* map */
.map{position:relative;height:440px;background:var(--grass);background-image:repeating-linear-gradient(0deg,transparent 0 14px,rgba(0,0,0,.05) 14px 16px),repeating-linear-gradient(90deg,transparent 0 14px,rgba(0,0,0,.05) 14px 16px);border-block:3px solid var(--ink);overflow:hidden}
.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.tile{position:absolute;display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.tile .lab{background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px 9px;display:flex;flex-direction:column;line-height:1.35}
.tile .n{font-weight:900;font-size:.92em}
.tile .s{font-size:.75em;font-weight:700}
.tile.done .s{color:var(--green)}
.tile.now .lab{background:var(--gold)}
.tile.lock{opacity:.7}
.tile.lock .lab{background:var(--lock)}
.tile.lock .s{color:var(--mute)}
/* chapter */
.scene{background:var(--paper2);border-bottom:3px solid var(--ink)}
.scene svg{width:100%;height:auto}
.ctx{display:flex;flex-direction:column;gap:10px}
.bub{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.bub .who2{font-size:.72em;font-weight:700;color:var(--mute);margin-bottom:2px}
.bub .tx{background:var(--white);border:3px solid var(--ink);padding:8px 11px;min-width:0}
.bub.me{justify-content:flex-end}
.bub.me .tx{background:var(--me)}
.card{background:var(--paper2);border:3px dashed var(--ink);padding:10px 12px}
.card .lb{font-size:.72em;font-weight:900;color:var(--red);letter-spacing:.1em}
.clue{background:var(--gold-soft);border:3px solid var(--ink);padding:10px 12px}
.task{background:var(--ink);color:var(--paper);padding:10px 12px}
.task b{color:var(--gold)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--white);border:3px solid var(--ink);padding:9px 12px;min-height:48px}
.opt .k{font-family:var(--f-px);font-size:.65em;color:var(--mute);flex:none;width:22px}
.opt[aria-pressed="true"]{background:var(--gold-soft);box-shadow:4px 4px 0 var(--ink)}
.opt[aria-pressed="true"] .k{color:var(--ink)}
.chat{border:3px solid var(--ink);background:#9fbcd8}
.chat .hd{background:#3f6e9a;color:var(--white);padding:6px 12px;font-weight:700;font-size:.85em;display:flex;justify-content:space-between}
.chat .bd{padding:12px;display:flex;flex-direction:column;gap:9px}
.line{display:flex;gap:8px;align-items:flex-end}
.line.me{justify-content:flex-end}
.line button{text-align:left;background:var(--white);border:3px solid var(--ink);padding:8px 10px;min-height:44px;max-width:85%}
.line.me button{background:var(--me)}
.line button[aria-pressed="true"]{background:var(--gold-soft);outline:3px dashed var(--red);outline-offset:3px}
.line .nm{font-size:.7em;font-weight:700;color:var(--ink);display:block}
.ev{background:var(--paper);border:3px solid var(--ink);padding:9px 11px;display:flex;flex-direction:column;gap:8px}
.ev .no{font-family:var(--f-px);font-size:.6em;color:var(--mute)}
.tags{display:flex;gap:6px}
.tag{flex:1;min-height:42px;background:var(--white);border:3px solid var(--ink);font-weight:700;font-size:.88em;padding:2px 4px}
.tag[aria-pressed="true"]{background:var(--ink);color:var(--gold)}
.foot{position:sticky;bottom:0;background:var(--paper);border-top:3px solid var(--ink);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.foot .row{display:flex;gap:10px}
.foot .row .btn:last-child{flex:1}
.chbody{background:var(--paper);flex:1;display:flex;flex-direction:column;gap:12px;padding-block:16px}
/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(15,18,38,.78);display:flex;align-items:flex-end;justify-content:center}
.ov .sheet{background:var(--paper);width:100%;max-width:460px;max-height:85%;overflow:auto;border-top:4px solid var(--ink);padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
/* review */
.grid{display:flex;flex-direction:column;gap:10px}
.grow{display:flex;align-items:center;gap:8px}
.grow .cn{width:5.6em;font-weight:700;font-size:.85em;flex:none}
.qs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:1}
.qb{font-family:var(--f-px);font-size:.65em;min-height:44px;border:3px solid var(--ink);background:var(--gold);color:var(--ink)}
.qb.miss{background:var(--red);color:var(--white)}
.warn{background:var(--red-soft);border:3px solid var(--red);padding:9px 12px;color:#6e1f1a}
.ok{background:#e1f2d8;border:3px solid var(--green);padding:9px 12px;color:#1f4a28}
/* result */
.score{display:flex;align-items:baseline;gap:8px}
.score .big{font-family:var(--f-px);font-size:2em}
.cs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center;font-size:.8em}
.cs div{background:var(--white);border:2px solid var(--ink);padding:6px 2px;font-variant-numeric:tabular-nums}
.ritem{border-top:2px dashed var(--mute);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.ritem .h{display:flex;justify-content:space-between;font-weight:900}
.good{color:var(--green)} .bad{color:var(--red)}
.badge{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .25s steps(3) both}
  @keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
}
</style>
<style>
body{margin:0}
.savest{font-size:.85em;color:var(--lilac);white-space:nowrap}
.savest.err{color:var(--gold)}
.ribbon.teach{background:var(--night2)}
</style>

function api(fn){
  var args=[].slice.call(arguments,1);
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow',credentials:'omit',cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('http '+r.status); return r.json(); });
}
var SAVE_TEXT={idle:'',saving:'存檔中…',saved:'已存檔',error:'網路不穩，重試中…'};
function setSave(st){ S.saveState=st; var els=document.querySelectorAll('[data-save]'); for (var i=0;i<els.length;i++){ els[i].textContent=SAVE_TEXT[st]; els[i].className='savest'+(st==='error'?' err':''); } updSubmitBtn(); }
function enqueue(job){
  if (PREVIEW) return;
  S.queue=S.queue.filter(function(j){return j.key!==job.key || j===S.queue[0]&&S.saving;});
  S.queue.push(job); setSave('saving'); pump();
}
function pump(){
  if (S.saving || !S.queue.length || S.fatal) return;
  S.saving=true;
  var job=S.queue[0];
  api.apply(null,[job.fn].concat(job.args)).then(function(r){
    S.saving=false;
    if (r && r.ok){ S.queue.shift(); setSave(S.queue.length?'saving':'saved'); pump(); }
    else if (r && r.code==='busy'){ retry(); }
    else { S.queue=[]; S.fatal=(r&&r.msg)||'存檔失敗，請重新登入。'; render(); }
  }).catch(function(){ S.saving=false; retry(); });
}
function retry(){ setSave('error'); setTimeout(pump,3000); }
function pending(){ return S.queue.length>0 || S.saving; }
function updSubmitBtn(){ var b=document.getElementById('askconf'); if (b && S.view==='review'){ var miss=QIDS.filter(function(id){return !answered(id);}).length; b.disabled = miss>0 || pending(); b.textContent = miss ? '正式提交（尚有 '+miss+' 題未完成）' : (pending()?'存檔中，請稍候…':'正式提交 ▶'); } }

      return '<button class="qb'+(ok?'':' miss')+'" data-act="edit" data-q="'+id+'" '+(open?'':'disabled')+' aria-label="第 '+n+' 題，'+(ok?'已作答':'未完成')+'">'+n+'</button>';
    }).join('')+'</div></div>';
  }).join('');
  var conf=S.confirm?'<div class="ov" role="dialog" aria-modal="true" aria-label="確認提交"><div class="sheet gut"><h2>確定要正式提交嗎？</h2><p style="margin:0">提交後就不能再修改答案，每個學號只能提交一次。</p>'+(S.err?'<p class="err" role="alert">'+esc(S.err)+'</p>':'')+'<div class="foot" style="position:static;padding:0;border:0;background:none"><div class="row"><button class="btn ghost small" data-act="noconf">再檢查一下</button><button class="btn" data-act="dosubmit" '+(S.busy?'disabled':'')+'>'+(S.busy?'提交中…':'確定提交')+'</button></div></div></div></div>':'';
  return topbar('見習報告','提交前檢查',{left:'<button class="iconbtn" data-act="map" aria-label="回到地圖">◀</button>',r:''})+
   '<div class="main gut"><div class="panel px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>已作答</b><span class="pf" style="font-size:.85em">'+(20-miss.length)+' / 20</span></div>'+
   '<div class="grid">'+rows+'</div>'+
   (miss.length?'<div class="warn">還有 '+miss.length+' 題未完成（紅色）。點題號就能回去作答或修改。</div>':'<div class="ok">20 題都完成了。點題號可以回去修改，確認後再提交。</div>')+'</div>'+
   '<p class="note" style="color:var(--lilac)">提交前所有題目都能修改；正式提交後不能更改。分數與解析會在老師公布後，從同一個連結查看。</p>'+
   '<button class="btn" id="askconf" data-act="askconf">正式提交 ▶</button></div>'+conf;
}
function vSubmitted(){
  var t=new Date(S.submittedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
  var tail;
  if (PREVIEW) tail='<div class="panel px" style="background:var(--gold-soft)"><b>教師試玩</b><p class="note" style="color:var(--ink)">這次作答沒有寫入成績。正式版學生要等你公布後才看得到分數。</p><button class="btn" data-act="result">查看分數與解析</button><button class="btn ghost small" style="width:100%" data-act="replay">重新試玩</button></div>';
  else if (S.result) tail='<div class="panel px" style="background:var(--gold-soft)"><b>成績已公布</b><button class="btn" data-act="result">查看分數與解析 ▶</button></div>';
  else tail='<p class="note" style="color:var(--lilac);text-align:center">分數與解析會在老師公布後，用同一個連結、同樣的學號與姓名登入查看。</p>';
  return topbar('見習報告','提交成功',{left:face(me(),36),r:''})+
   '<div class="main gut" style="justify-content:center"><div class="panel px badge pop">'+badge(80)+
   '<h2>見習報告已提交</h2><div class="pf" style="font-size:.8em">'+esc(S.code||'')+'</div>'+
   '<p style="margin:0">提交時間：'+esc(t)+'<br>學號：'+esc(S.sid)+'　姓名：'+esc(S.name)+'</p>'+
   '<p class="note">建議截圖留存。</p></div>'+tail+'</div>';
}
function vResult(){
  var R=S.result, items='';
  R.items.forEach(function(it){
    var body;
    if (it.kind==='sort') body='<div style="font-size:.9em">'+it.cards.map(function(c){ return '<span class="'+(c.ok?'good':'bad')+'">'+(c.ok?'○ ':'× ')+'</span>'+esc(c.t)+'：'+esc(c.label); }).join('<br>')+'</div>';
    else body='<div style="font-size:.9em">你的答案：'+esc(it.mine)+'</div>'+(it.score===5?'':'<div style="font-size:.9em">建議答案：'+esc(it.right)+'</div>');
    items+='<div class="ritem"><div class="h"><span>第 '+it.n+' 題</span><span class="'+(it.score===5?'good':'bad')+'">'+it.score+' / 5</span></div>'+body+'<div class="note" style="color:var(--ink)">'+esc(it.exp)+'</div></div>';
  });
  var per=R.per.map(function(v,i){ return '<div><div>'+'一二三四五'[i]+'章</div><b>'+v+'</b>/20</div>'; }).join('');
  return topbar(PREVIEW?'教師試玩':'期中評量','分數與解析',{left:'<button class="iconbtn" data-act="back" aria-label="回到提交頁">◀</button>',r:''})+
   '<div class="main gut"><div class="panel px"><div class="score"><span class="big">'+R.total+'</span><span>/ 100　計入學期成績 '+(R.total*0.3).toFixed(1)+' 分</span></div><div class="cs">'+per+'</div>'+items+'</div></div>';
}
function vFatal(){
  return '<div class="ov" role="alertdialog" aria-modal="true" aria-label="無法存檔"><div class="sheet gut"><h2>無法存檔</h2><p style="margin:0">'+esc(S.fatal)+'</p><button class="btn" data-act="relogin">回到登入畫面</button></div></div>';
}

/* ---------- 流程 ---------- */
function openQ(){ var st=curStep(); if (st && st.q){ var a=S.ans[st.q], k=Q[st.q].kind; S.sel = a===undefined ? (k==='sort'?{}:null) : (k==='sort'?JSON.parse(JSON.stringify(a)):a); } }
function enter(i){
  S.ch=i; S.mode='play';
  var steps=CH[i].steps, last=-1;
  steps.forEach(function(s,k){ if (s.q && answered(s.q)) last=k; });
  S.step = chDone(i) ? 0 : Math.min(last+1, steps.length-1);
  S.view='chapter'; openQ();
}
function advance(){
  if (S.mode==='edit'){ S.view='review'; return; }
  if (S.step < CH[S.ch].steps.length-1){ S.step++; openQ(); }
  else S.view='chend';
}
function go(v){ S.view=v; S.overlay=false; S.confirm=false; S.err=''; render(); window.scrollTo(0,0); }

var app=document.getElementById('app');
function render(){
  app.className='app'+(S.big?' big':'');
  var v={loading:vLoading,loaderr:vLoadErr,login:vLogin,rules:vRules,avatar:vAvatar,prologue:vPrologue,map:vMap,chapter:vChapter,chend:vChEnd,review:vReview,submitted:vSubmitted,result:vResult}[S.view];
  app.innerHTML=v()+(S.fatal?vFatal():'');
  updSubmitBtn();
}
function afterLogin(r){
  S.sid=r.sid; S.name=r.name; S.tok=r.token||null; S.av=r.av||null; S.ans=r.ans||{}; S.fatal=null; S.queue=[];
  if (r.status==='submitted'){ S.submittedAt=r.submittedAt; S.code=r.code; S.result=r.result||null; go('submitted'); }
  else go(S.av?'map':'rules');
}

app.addEventListener('submit',function(e){
  if (e.target.id!=='login') return;
  e.preventDefault();
  var sid=document.getElementById('sid').value.trim(), nm=document.getElementById('sname').value.trim();
  S.sid=sid; S.name=nm;
  if (!sid || !nm){ S.err='請輸入學號和姓名。'; render(); return; }
  if (PREVIEW){ afterLogin({sid:sid.toUpperCase(),name:nm,av:null,ans:{},status:'new'}); return; }
  S.err=''; S.busy=true; render();
  api('login',sid,nm).then(function(r){
    S.busy=false;
    if (!r || !r.ok){ S.err=(r&&r.msg)||'登入失敗，請再試一次。'; render(); return; }
    afterLogin(r);
  }).catch(function(){ S.busy=false; S.err='連線失敗。請確認網路後再按一次「進入任務」。'; render(); });
});
app.addEventListener('change',function(e){ if (e.target.id==='agree'){ S.agreed=e.target.checked; render(); var a=document.getElementById('agree'); if (a) a.focus(); } });
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var act=b.getAttribute('data-act');
  switch(act){
    case 'font': S.big=!S.big; try{ localStorage.setItem('nkuht-mid-big',S.big?'1':'0'); }catch(err){} render(); break;
    case 'toAvatar': go('avatar'); break;
    case 'av': S.av=b.getAttribute('data-id'); render(); break;
    case 'toPrologue': enqueue({key:'profile',fn:'saveProfile',args:[S.sid,S.tok,S.av]}); S.pstep=0; S.practice=null; go('prologue'); break;
    case 'psel': S.practice=b.getAttribute('data-id'); render(); break;
    case 'pnext': if (S.pstep<PRO.length-1){ S.pstep++; render(); window.scrollTo(0,0); } else go('map'); break;
    case 'map': go('map'); break;
    case 'enter': enter(+b.getAttribute('data-i')); render(); window.scrollTo(0,0); break;
    case 'next': advance(); render(); window.scrollTo(0,0); break;
    case 'sel': var q=Q[curStep().q]; S.sel = q.kind==='tap' ? +b.getAttribute('data-v') : b.getAttribute('data-v'); render(); break;
    case 'tag': S.sel=S.sel||{}; S.sel[+b.getAttribute('data-c')]=+b.getAttribute('data-v'); render(); break;
    case 'submitq':
      if (S.submittedAt) return;
      var qid=curStep().q, val=S.sel;
      S.ans[qid]=val;
      enqueue({key:qid,fn:'saveAnswer',args:[S.sid,S.tok,qid,val]});
      advance(); render(); window.scrollTo(0,0); break;
    case 'ctx': S.overlay=true; render(); break;
    case 'closectx': S.overlay=false; render(); break;
    case 'review': go('review'); break;
    case 'edit':
      var id=b.getAttribute('data-q'), ci=chOf(Q[id].ch);
      S.ch=ci; S.mode='edit'; S.step=CH[ci].steps.map(function(s){return s.q;}).indexOf(id); S.view='chapter'; openQ(); render(); window.scrollTo(0,0); break;
    case 'askconf': S.confirm=true; S.err=''; render(); break;
    case 'noconf': S.confirm=false; render(); break;
    case 'dosubmit':
      S.busy=true; render();
      var p = PREVIEW ? api('previewScore',PREVIEW_KEY,S.ans) : api('submit',S.sid,S.tok);
      p.then(function(r){
        S.busy=false;
        if (!r || !r.ok){ S.err=(r&&r.msg)||'提交失敗，請再試一次。'; render(); return; }
        if (PREVIEW){ S.result=r.result; S.submittedAt=Date.now(); S.code='教師試玩'; }
        else { S.submittedAt=r.submittedAt; S.code=r.code; S.result=null; }
        go('submitted');
      }).catch(function(){ S.busy=false; S.err='連線失敗，答案還沒有提交。請確認網路後再按一次「確定提交」。'; render(); });
      break;
    case 'result': go('result'); break;
    case 'back': go('submitted'); break;
    case 'replay': S.ans={}; S.av=null; S.submittedAt=null; S.code=null; S.result=null; S.agreed=false; go('login'); break;
    case 'boot': boot(); break;
    case 'relogin': S.fatal=null; S.queue=[]; S.tok=null; go('login'); break;
  }
});
app.addEventListener('keydown',function(e){ if (e.key==='Escape' && (S.overlay||S.confirm)){ S.overlay=false; S.confirm=false; render(); } });
function boot(){
  S.view='loading'; render();
  api('bank',PREVIEW_KEY).then(function(r){
    if (!r || !r.ok || !r.bank) throw new Error('bad');
    Q=r.bank; QIDS=Object.keys(Q); BOOT={rules:r.rules||{}}; PREVIEW=!!r.preview;
    S.view='login'; render();
  }).catch(function(){ S.view='loaderr'; render(); });
}
boot();
})();
</script>
</body>
</html>
